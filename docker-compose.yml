version: '3.8'
services:
  db:

    image: mysql:8.0
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - db_data:/var/lib/mysql
      - ./db-dumps/wordpress.sql:/docker-entrypoint-initdb.d/wordpress.sql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE}
      MYSQL_USER: ${USERNAME}
      MYSQL_PASSWORD: ${USER_PASSWORD}

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      # - ./:/var/www/html
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./certs:/etc/apache2/ssl
      - ./logs/apache2:/var/log/apache2
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${USERNAME}
      WORDPRESS_DB_PASSWORD: ${USER_PASSWORD}
      WORDPRESS_DB_NAME: ${DATABASE}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DISABLE_FATAL_ERROR_HANDLER', true);
        define('WP_HOME', 'https://${CODESPACE_NAME}-80.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}');
        define('WP_SITEURL', 'https://${CODESPACE_NAME}-80.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}');
    command: >
      bash -c "
        a2enmod ssl &&
        a2ensite default-ssl &&
        sed -i 's|SSLCertificateFile.*|SSLCertificateFile /etc/apache2/ssl/ssl.crt|' /etc/apache2/sites-available/default-ssl.conf &&
        sed -i 's|SSLCertificateKeyFile.*|SSLCertificateKeyFile /etc/apache2/ssl/ssl.key|' /etc/apache2/sites-available/default-ssl.conf &&
        docker-entrypoint.sh apache2-foreground
      "

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    restart: always

  whoisServer:
    image: node:18
    working_dir: /usr/src/app
    expose:
      - "3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: always
    command: sh -c "npm install && node server.js"

volumes:
  db_data:
  wp_data:
